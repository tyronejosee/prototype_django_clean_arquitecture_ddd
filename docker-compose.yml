services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: grocery_db
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5500:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d grocery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.0
    container_name: grocery_redis
    ports:
      - 6400:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=grocery_db
      - DB_USER=grocery_user
      - DB_PASSWORD=grocery_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
