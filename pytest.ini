[pytest]
DJANGO_SETTINGS_MODULE = src.core.settings
django_find_project = true
minversion = 6.0
python_files = tests.py test_*.py *_tests.py
pythonpath = src
addopts =
  --cov-config=.coveragerc
  --cov-report=html
  --cov-report=term-missing
  --cov-report=xml
  --cov=src
  --import-mode=importlib
