name: Marketly CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "release/*"
  pull_request:
    branches:
      - main
      - develop
      - "feature/*"
      - "hotfix/*"
      - "release/*"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      PROJECT_DESCRIPTION: ${{ secrets.PROJECT_DESCRIPTION }}
      PROJECT_VERSION: ${{ secrets.PROJECT_VERSION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: ${{ secrets.DEBUG }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      CACHE_LOCATION: ${{ secrets.CACHE_LOCATION }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      LICENCE_NAME: ${{ secrets.LICENCE_NAME }}
      LICENCE_URL: ${{ secrets.LICENCE_URL }}
      CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
      CONTACT_URL: ${{ secrets.CONTACT_URL }}
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: |
          pip install pytest
          pytest -n 4 --maxfail=3 --disable-warnings -v

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      TAG: ${{ steps.docker-tag.outputs.TAG }}
      ENV: ${{ steps.docker-tag.outputs.ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine Docker Tag
        id: docker-tag
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            TAG="prod-${GITHUB_SHA}"
            ENV="prod"
          elif [[ "${GITHUB_REF##*/}" == "develop" ]]; then
            TAG="staging-${GITHUB_SHA}"
            ENV="staging"
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "::set-output name=TAG::$TAG"
          echo "::set-output name=ENV::$ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            -t tyronejose/marketly:${TAG} .

      - name: Push Docker image
        run: |
          docker push tyronejose/marketly:${TAG}

